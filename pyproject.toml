[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orgbot"
version = "0.1.0"
description = "RAG-based organizational knowledge agent for a mock NSE-connected trading platform"
requires-python = ">=3.11"
dependencies = [
    "llama-index-core>=0.11.0",
    "llama-index-llms-anthropic>=0.2.0",
    "anthropic>=0.40.0",
    "neo4j>=5.20.0",
    "chromadb>=0.5.0,<1.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "faker>=25.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "PyYAML>=6.0.0",
    "psycopg2-binary>=2.9.9",
    "apscheduler>=3.10.0,<4.0",
    "slack-bolt>=1.18.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[project.scripts]
orgbot-generate = "simulators.generate_all:main"
orgbot-ingest = "ingestion.ingest_all:main"
orgbot-slackbot = "services.slackbot.app:main"

[tool.setuptools.packages.find]
include = ["core*", "simulators*", "services*", "ingestion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
