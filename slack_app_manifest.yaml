# OrgBot Slack app manifest.
# Create app at https://api.slack.com/apps -> Create New App -> From an app manifest
# (select your workspace, paste this file, then Review and create).
display_information:
  name: OrgBot
  description: Org knowledge agent - Q&A with SME feedback
  background_color: "#4A154B"

features:
  bot_user:
    display_name: OrgBot
    always_online: true

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - conversations:history

settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
